services:
  - type: workflow
    name: ai-oncall-engineer-workflow
    runtime: python
    region: oregon
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python workflows.py
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"
