# Render Blueprint: a persistent PostgreSQL database, public web app, and
# separate background diagnosis worker. Secret values are entered in Render.
databases:
  - name: incident-agent-db
    databaseName: incident_agent
    plan: basic_256mb
    region: singapore
    diskSizeGB: 1
    ipAllowList: []

envVarGroups:
  - name: incident-agent-core
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: incident-agent-db
          property: connectionString
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      # --- Auto-fix engine (fixengine/). Off until FIXENGINE_ENABLED is 1. Keys are entered in Render, never in code. ---
      - key: FIXENGINE_ENABLED
        value: "0"
      - key: FIXENGINE_PROVIDER
        value: auto
      - key: FIXENGINE_BUDGET_INR
        value: "400"
      - key: FIXENGINE_CREDITS_INR
        value: "500"
      # Render cannot run Docker, so fixes are tested on a separate small server running sandbox_service.py (see FIXENGINE.md).
      - key: FIXENGINE_SANDBOX_MODE
        value: remote
      # --- Push guard (architecture v3): every push to a connected repo is tested in the sandbox. Free: no AI tries. ---
      - key: PUSH_CHECKS_ENABLED
        value: "1"
      - key: PUSH_POLL_SECONDS
        value: "180"           # fallback poll for pushes whose webhook was missed
      - key: PUSH_MAX_CHECKS_PER_HOUR
        value: "12"
      # --- Email and links: shared by the web app AND the worker (the engine emails admins when it needs a decision) ---
  - name: incident-agent-web-secrets
    envVars:
      - key: SESSION_SECRET
        generateValue: true

services:
  - type: web
    name: incident-agent-web
    runtime: docker
    branch: main
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - fromGroup: incident-agent-core
      - fromGroup: incident-agent-web-secrets
      - key: COOKIE_DOMAIN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: FIXENGINE_SANDBOX_URL
        sync: false
      - key: FIXENGINE_SANDBOX_SECRET
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: PORTAL_BASE_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: UPI_ID
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: PORTAL_RUN_WORKER
        value: "0"

  - type: worker
    name: incident-agent-worker
    runtime: docker
    branch: main
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerCommand: python portal_worker.py
    autoDeploy: true
    envVars:
      - fromGroup: incident-agent-core
      - key: GROQ_API_KEY
        sync: false
      - key: FIXENGINE_SANDBOX_URL
        sync: false
      - key: FIXENGINE_SANDBOX_SECRET
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: PORTAL_BASE_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: WORKER_POLL_SECONDS
        value: "5"
      - key: WORKER_MIN_OCCURRENCES
        value: "1"
      - key: WORKER_MIN_AGE_SECONDS
        value: "30"

